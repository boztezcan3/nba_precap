name: Update watchlist
on:
  schedule:
    - cron: "0 12 */2 * *"   # every 2 days, 12:00 UTC (~7-8am ET)
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r requirements.txt
      - run: python build.py
      - name: Commit page
        run: |
          git config user.name "watchlist-bot"
          git config user.email "bot@users.noreply.github.com"
          git add docs
          git diff --cached --quiet || git commit -m "Update watchlist"
          git push
